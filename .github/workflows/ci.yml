name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore src/BotArbitragem.Api/BotArbitragem.Api.csproj
      - run: dotnet build src/BotArbitragem.Api/BotArbitragem.Api.csproj --no-restore --configuration Release
      - run: dotnet test tests/BotArbitragem.Application.Tests/BotArbitragem.Application.Tests.csproj --configuration Release
